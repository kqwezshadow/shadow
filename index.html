<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Где ты?</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .my-info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(0.98);
        }
        .home { background: #10b981; }
        .college { background: #3b82f6; }
        .coffee { background: #f59e0b; }
        .pclub { background: #ef4444; }
        .user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .status-icon { font-size: 28px; }
        .user-name { font-weight: bold; }
        .user-status { font-size: 12px; color: #666; margin-top: 4px; }
        .error {
            background: #fee;
            color: red;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📍 Где ты? <span style="font-size: 12px; background: #10b981; color: white; padding: 2px 8px; border-radius: 20px;">LIVE</span></h1>
            <p style="color: #666; font-size: 14px; margin: 10px 0 0 0;">Поделись своим местоположением</p>
        </div>

        <div id="myInfo" class="my-info">Загрузка...</div>
        <div id="error"></div>

        <div class="buttons">
            <button class="home" onclick="setStatus('Дома')">🏠 Дома</button>
            <button class="college" onclick="setStatus('В колледже')">🏫 В колледже</button>
            <button class="coffee" onclick="setStatus('В кофе')">☕ В кофе</button>
            <button class="pclub" onclick="setStatus('В ПК клубе')">🎮 В ПК клубе</button>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 15px 0;">👥 Команда <span class="online-dot"></span></h3>
            <div id="users">Загрузка...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ВАШИ ДАННЫЕ (исправлено!)
        const URL = 'https://rncerhgizyjhovbdpqnl.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4bWNlcmhnaXp5amhvdmJkcHFubCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzU5MTI1NjMyLCJleHAiOjIwNzQ3MDE2MzJ9.K7U-7jOJHExwxM1XmYCQunP-XM5-fOgEp0tRjz7qbA0';
        const MY_ID = '64e0c828-9e67-45db-ab5a-73bb67da5aba';  // Ваш новый ID
        
        const supabase = createClient(URL, KEY);

        window.setStatus = async (status) => {
            const btn = event.target;
            btn.style.opacity = '0.7';
            
            const { error } = await supabase
                .from('profiles')
                .update({ status: status })
                .eq('id', MY_ID);
            
            btn.style.opacity = '1';
            
            if (error) {
                document.getElementById('error').innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
                setTimeout(() => document.getElementById('error').innerHTML = '', 3000);
            } else {
                loadUsers();
            }
        };

        async function loadUsers() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('username');
            
            if (error) {
                document.getElementById('users').innerHTML = `<div class="error">❌ ${error.message}</div>`;
                return;
            }
            
            if (!data || data.length === 0) {
                document.getElementById('users').innerHTML = '<div style="color: #666;">Нет пользователей. Добавьте себя в таблицу!</div>';
                return;
            }
            
            const me = data.find(u => u.id === MY_ID);
            if (me) {
                document.getElementById('myInfo').innerHTML = `👋 <strong>${me.username}</strong><br>📍 Твой статус: <strong style="color: #667eea;">${me.status || 'не задан'}</strong>`;
            } else {
                document.getElementById('myInfo').innerHTML = `⚠️ Тебя нет в таблице!<br><small>Добавь через Table Editor с ID: ${MY_ID}</small>`;
            }
            
            document.getElementById('users').innerHTML = data.map(u => `
                <div class="user-item">
                    <div class="status-icon">${getIcon(u.status)}</div>
                    <div>
                        <div class="user-name">${escapeHtml(u.username)} ${u.id === MY_ID ? '<span style="color: #667eea; font-size: 11px;">(Вы)</span>' : ''}</div>
                        <div class="user-status">${u.status || 'Не указано'}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function getIcon(status) {
            if (status === 'Дома') return '🏠';
            if (status === 'В колледже') return '🏫';
            if (status === 'В кофе') return '☕';
            if (status === 'В ПК клубе') return '🎮';
            return '📍';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Загружаем пользователей
        loadUsers();
        
        // Realtime подписка
        const channel = supabase.channel('online-status')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
                loadUsers();
            })
            .subscribe();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Turan Education | Монитор группы — Новая эра обучения</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(15, 25, 45, 1) 0%, rgba(8, 12, 24, 1) 100%);
            min-height: 100vh;
            color: #eef2ff;
        }

        /* Modern glassmorphism & smooth corners */
        .glass-card {
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 32px;
            border: 1px solid rgba(72, 187, 255, 0.2);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 10%, #0a0f2a, #030617);
        }

        .login-box {
            background: rgba(12, 20, 35, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid rgba(98, 213, 255, 0.3);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }

        .login-box h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #FFFFFF, #80CFFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .google-btn {
            background: linear-gradient(95deg, #4285f4, #34a853);
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.3);
        }

        .google-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(66, 133, 244, 0.5);
        }

        /* Main app header */
        .main-app {
            display: none;
            padding: 20px 24px 32px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            background: rgba(10, 20, 35, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-lg {
            width: 52px;
            height: 52px;
            border-radius: 100px;
            border: 2px solid #5dade2;
            object-fit: cover;
        }

        .user-name {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.4);
            border-radius: 100px;
            padding: 4px 12px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
            animation: softPulse 1.6s infinite;
        }
        .break-dot {
            width: 10px;
            height: 10px;
            background: #f39c12;
            border-radius: 50%;
        }

        @keyframes softPulse {
            0% { opacity: 0.5; transform: scale(0.9);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn-neo {
            background: rgba(30, 45, 70, 0.8);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: #f0f3fa;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .btn-neo.primary {
            background: linear-gradient(120deg, #3b82f6, #8b5cf6);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .btn-neo.danger {
            background: rgba(239, 68, 68, 0.8);
        }
        .study-timer {
            background: #0f172a;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-left: 3px solid #facc15;
        }

        /* 3-х колоночная сетка */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }
        .col-monitor {
            flex: 1.2;
            min-width: 280px;
        }
        .col-chat {
            flex: 1.4;
            min-width: 340px;
        }
        .col-rank {
            flex: 1;
            min-width: 280px;
        }

        .section-card {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 20px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(72, 187, 255, 0.2);
            transition: all 0.2s;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #60a5fa;
            padding-left: 14px;
        }

        .loc-chip {
            background: rgba(0,0,0,0.4);
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 12px;
        }

        .user-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .user-chip {
            background: rgba(30, 45, 70, 0.7);
            border-radius: 60px;
            padding: 5px 12px 5px 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s linear;
        }
        .user-chip img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
        }
        .status-dot-small {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* чат */
        .chat-window {
            height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
            padding-right: 6px;
        }
        .message-bubble {
            background: rgba(25, 40, 60, 0.8);
            border-radius: 24px;
            padding: 10px 16px;
            max-width: 85%;
            word-break: break-word;
        }
        .message.own .message-bubble {
            background: linear-gradient(145deg, #3b82f6, #7c3aed);
            color: white;
        }
        .mention {
            background: #facc1540;
            border-radius: 20px;
            padding: 2px 8px;
            font-weight: 500;
        }
        .chat-input-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .chat-input-group input {
            flex: 1;
            background: #0f172f;
            border: 1px solid #334155;
            border-radius: 48px;
            padding: 14px 20px;
            color: white;
            outline: none;
        }

        /* Polls */
        .poll-card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 3px solid #60a5fa;
        }

        /* Рейтинг */
        .top-student-modern {
            background: linear-gradient(115deg, #2a3a5a, #1e2a44);
            border-radius: 24px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .student-row {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        .current-user-highlight {
            background: rgba(59, 130, 246, 0.3);
            border-left: 3px solid #facc15;
        }
        .achievement-modern {
            background: rgba(255,255,240,0.05);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modal-glass {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }
        .modal-card {
            background: #0f172fe6;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 550px;
            width: 90%;
            border: 1px solid #5dade280;
        }
        button {
            font-family: inherit;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        @media (max-width: 900px) {
            .dashboard { flex-direction: column; }
            .top-nav { flex-direction: column; align-items: stretch; border-radius: 28px; }
        }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div class="login-box">
        <h1>✨ Turan Space</h1>
        <p style="margin-bottom: 28px; color: #b9c7dd;">Умный мониторинг учебной группы</p>
        <button class="google-btn" id="loginBtn">🚀 Войти через Google</button>
    </div>
</div>

<div id="mainApp" class="main-app">
    <div class="top-nav">
        <div class="user-profile">
            <img id="userAvatar" class="avatar-lg">
            <div>
                <div id="userName" class="user-name"></div>
                <div class="status-badge"><span id="statusDot" class="online-dot"></span> <span id="statusText">Онлайн</span></div>
            </div>
            <div id="studyTimer" class="study-timer">⏱️ 0 ч 0 мин</div>
        </div>
        <div class="action-buttons">
            <select id="locationSelect" class="btn-neo">
                <option value="В колледже">🏛️ Колледж</option>
                <option value="В кофе">☕ Кофе</option>
                <option value="В ПК клубе">🎮 ПК клуб</option>
            </select>
            <button id="breakBtn" class="btn-neo">⏸ Перерыв</button>
            <button id="createPollHeaderBtn" class="btn-neo primary">📊 Опрос</button>
            <button id="logoutBtn" class="btn-neo danger">🚪 Выход</button>
        </div>
    </div>

    <div class="dashboard">
        <!-- Монитор группы -->
        <div class="col-monitor">
            <div class="section-card">
                <div class="section-title">👥 Онлайн · <span id="onlineCount">0</span></div>
                <div id="onlineList" class="user-chips"></div>
                
                <div class="loc-chip">🏫 Колледж</div>
                <div id="locationCollege" class="user-chips"></div>
                <div class="loc-chip">☕ Кофе-хаус</div>
                <div id="locationCoffee" class="user-chips"></div>
                <div class="loc-chip">🖥️ ПК Клуб</div>
                <div id="locationPc" class="user-chips"></div>
                <div class="loc-chip">⚫ Офлайн (всего)</div>
                <div id="offlineList" class="user-chips"></div>
            </div>
            <div class="section-card">
                <div class="section-title">📋 Активные опросы</div>
                <div id="activePollsList"></div>
            </div>
        </div>

        <!-- Чат с дизайном -->
        <div class="col-chat">
            <div class="section-card" style="display: flex; flex-direction: column; height: 100%;">
                <div class="section-title">💬 Общий чат · упоминай @имя</div>
                <div id="chatMessages" class="chat-window"></div>
                <div class="chat-input-group">
                    <input type="text" id="messageInput" placeholder="Ваше сообщение... @username">
                    <button class="btn-neo primary" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>

        <!-- Рейтинг и достижения -->
        <div class="col-rank">
            <div class="section-card">
                <div class="section-title">🏆 Топ студентов</div>
                <div id="topStudentsList"></div>
                <button id="fullRankBtn" class="btn-neo" style="width:100%; margin-top: 12px;">📋 Полный рейтинг</button>
            </div>
            <div class="section-card">
                <div class="section-title">📈 Моя статистика</div>
                <div id="personalStats" class="glass-card" style="padding: 12px; background: rgba(0,0,0,0.3); border-radius: 1.5rem;"></div>
            </div>
            <div class="section-card">
                <div class="section-title">🎖️ Достижения</div>
                <div id="achievementsList" style="max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal full rating -->
<div id="fullRatingModal" class="modal-glass" style="display: none;">
    <div class="modal-card">
        <h3 style="margin-bottom: 20px;">🏆 Полный рейтинг</h3>
        <div id="fullRatingList" style="max-height: 60vh; overflow-y: auto;"></div>
        <button class="btn-neo" style="margin-top: 20px;" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<div id="createPollModal" class="modal-glass" style="display: none;">
    <div class="modal-card">
        <h3>📊 Новый опрос</h3>
        <input type="text" id="pollQuestion" placeholder="Вопрос" style="width:100%; margin: 15px 0; padding: 12px; background:#0f172f; border:1px solid #334155; border-radius: 28px; color:white;">
        <div id="pollOptionsContainer">
            <div class="option-input"><input type="text" placeholder="Вариант 1" class="pollOption" style="background:#0f172f; border-radius:28px; padding:10px;"></div>
            <div class="option-input"><input type="text" placeholder="Вариант 2" class="pollOption" style="background:#0f172f; border-radius:28px; padding:10px; margin-top: 8px;"></div>
        </div>
        <button class="btn-neo" style="margin: 10px 0;" onclick="addPollOption()">+ Добавить вариант</button>
        <button class="btn-neo primary" onclick="createPoll()">Создать опрос</button>
        <button class="btn-neo" style="margin-top: 8px;" onclick="closePollModal()">Отмена</button>
    </div>
</div>

<script>
    const supabase = window.supabase.createClient(
        'https://xwmckxrikcfalulwkhii.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bWNreHJpa2NmYWx1bHdraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjM3MTUsImV4cCI6MjA5MTE5OTcxNX0.8c5ty2PB2bsAwUk0ZoiY0g0dk-KIws7h4UT1MESSaGY'
    );

    let currentUser = null, allUsers = [], onlineUsers = new Map(), messages = [], activePolls = [];
    let totalSeconds = 0, timerInterval = null, isOnBreak = false, currentLocation = 'В колледже';
    let userMessagesCount = 0, userMaxSessionDuration = 0, userCurrentStreak = 1, userTotalSessions = 0, userUnlockedAchievements = [], sessionStartHour = new Date().getHours(), userCreatedPoll = false;

    const ACHIEVEMENTS = [
        { id: 'first_blood', name: 'First Blood', desc: 'Первая сессия', icon: '🩸', check: () => userTotalSessions >= 1 },
        { id: 'double_kill', name: 'Double Kill', desc: '2 часа подряд', icon: '⚔️', check: () => userMaxSessionDuration >= 7200 },
        { id: 'rampage', name: 'Rampage', desc: '5 часов подряд', icon: '🔥', check: () => userMaxSessionDuration >= 18000 },
        { id: 'early_bird', name: 'Ранняя пташка', desc: 'До 8:00', icon: '🌅', check: () => sessionStartHour < 8 },
        { id: 'night_owl', name: 'Ночная сова', desc: 'После 23:00', icon: '🦉', check: () => sessionStartHour >= 23 },
        { id: 'activist', name: 'Активист', desc: '20 сообщений', icon: '💬', check: () => userMessagesCount >= 20 },
        { id: 'social', name: 'Душа компании', desc: '50 сообщений', icon: '🦋', check: () => userMessagesCount >= 50 },
        { id: 'hardworker', name: 'Трудоголик', desc: '5 часов суммарно', icon: '💪', check: () => totalSeconds >= 18000 },
        { id: 'academic', name: 'Академик', desc: '50 часов', icon: '🎓', check: () => totalSeconds >= 180000 },
        { id: 'streak_week', name: 'Первая неделя', desc: '7 дней', icon: '📆', check: () => userCurrentStreak >= 7 },
        { id: 'poll_creator', name: 'Организатор', desc: 'Создал опрос', icon: '📊', check: () => userCreatedPoll },
    ];

    function escapeHtml(s) { return s?.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}) || ''; }
    function showNotification(msg) { const t = document.createElement('div'); t.innerText = msg; t.style.cssText = 'position:fixed;bottom:20px;left:20px;background:#1e293b;backdrop-filter:blur(12px);padding:12px 20px;border-radius:40px;color:white;z-index:1200;'; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500); }
    function showAchievementToast(ach) { const t = document.createElement('div'); t.innerHTML = `<div style="display:flex;gap:12px;"><span style="font-size:28px;">${ach.icon}</span><div><b>🏆 ${ach.name}</b><br>${ach.desc}</div></div>`; t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#0f172fe6;backdrop-filter:blur(12px);border-radius:28px;padding:14px 18px;color:white;z-index:1200;border-left:4px solid gold;'; document.body.appendChild(t); setTimeout(()=>t.remove(), 4000); }

    function calculatePoints(seconds, messages, streak) { return Math.floor(seconds / 3600) * 10 + messages * 2 + streak * 5; }
    function getTitle(p) { if(p>=2500) return 'Immortal'; if(p>=1500) return 'Legend'; if(p>=800) return 'Archon'; return 'Herald'; }
    function highlightMentions(t) { return t.replace(/@(\w+)/g, '<span class="mention">@$1</span>'); }

    async function loadProfiles() { const { data } = await supabase.from('profiles').select('*'); if(data) allUsers = data; renderTopStudents(); updateOnlineStatus(); }
    async function loadMessages() { const { data } = await supabase.from('messages').select('*').order('created_at',{ascending:true}).limit(100); if(data) { messages = data; renderMessages(); } }
    async function loadPolls() { const { data } = await supabase.from('polls').select('*').eq('is_active', true); if(data) { activePolls = data; renderActivePolls(); } }
    async function loadUserAchievements() { if(!currentUser) return; const { data } = await supabase.from('user_achievements').select('*').eq('user_id', currentUser.id).single(); if(data) { totalSeconds = data.total_seconds||0; userMaxSessionDuration = data.max_session||0; userTotalSessions = data.total_sessions||0; userUnlockedAchievements = data.unlocked_achievements||[]; userCreatedPoll = data.created_poll||false; } updateTimerDisplay(); }
    async function loadUserProfile() { if(!currentUser) return; const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single(); if(data) { userMessagesCount = data.messages_count||0; userCurrentStreak = data.current_streak||1; currentLocation = data.location||'В колледже'; isOnBreak = data.on_break||false; document.getElementById('locationSelect').value = currentLocation; const b = document.getElementById('breakBtn'); if(b) b.textContent = isOnBreak ? '▶ Вернуться' : '⏸ Перерыв'; document.getElementById('statusDot').className = isOnBreak ? 'break-dot' : 'online-dot'; document.getElementById('statusText').innerText = isOnBreak ? 'Перерыв' : 'Онлайн'; } }
    async function updateProfile() { if(!currentUser) return; await supabase.from('profiles').upsert({ id: currentUser.id, full_name: currentUser.full_name, avatar_url: currentUser.avatar_url, study_seconds: totalSeconds, messages_count: userMessagesCount, current_streak: userCurrentStreak, location: currentLocation, on_break: isOnBreak, last_seen: Date.now() }); }
    async function updateUserAchievements() { if(!currentUser) return; await supabase.from('user_achievements').upsert({ user_id: currentUser.id, total_seconds: totalSeconds, max_session: userMaxSessionDuration, total_sessions: userTotalSessions, unlocked_achievements: userUnlockedAchievements, created_poll: userCreatedPoll }); }
    async function saveUserData() { await updateProfile(); await updateUserAchievements(); renderTopStudents(); checkAndUnlockAchievements(); }
    async function checkAndUnlockAchievements() { let newUnlocked = []; for(let ach of ACHIEVEMENTS) if(ach.check() && !userUnlockedAchievements.includes(ach.id)) { userUnlockedAchievements.push(ach.id); newUnlocked.push(ach); } if(newUnlocked.length) { await updateUserAchievements(); newUnlocked.forEach(ach => showAchievementToast(ach)); } renderAchievements(); }

    function renderAchievements() { const c = document.getElementById('achievementsList'); if(!c) return; c.innerHTML = ACHIEVEMENTS.map(ach => `<div class="achievement-modern ${userUnlockedAchievements.includes(ach.id) ? 'unlocked' : ''}" style="opacity:${userUnlockedAchievements.includes(ach.id)?1:0.6}"><div style="font-size:28px;">${ach.icon}</div><div><b>${ach.name}</b><div style="font-size:11px;">${ach.desc}</div></div>${userUnlockedAchievements.includes(ach.id)?'✅':'🔒'}</div>`).join(''); }
    
    async function sendMessage() { const inp = document.getElementById('messageInput'); const text = inp.value.trim(); if(!text || !currentUser) return; const mentions = []; const regex = /@(\w+)/g; let m; while((m = regex.exec(text)) !== null) { const u = allUsers.find(u=>u.full_name&&u.full_name.includes(m[1])); if(u && u.id !== currentUser.id) mentions.push(u.id); } const msg = { user_id: currentUser.id, user_name: currentUser.full_name, avatar_url: currentUser.avatar_url, text: text, mentions, created_at: new Date() }; const { error } = await supabase.from('messages').insert(msg); if(!error) { inp.value = ''; userMessagesCount++; await saveUserData(); } else showNotification('Ошибка отправки'); }
    function renderMessages() { const container = document.getElementById('chatMessages'); if(!container) return; container.innerHTML = messages.slice(-50).map(msg => { const isOwn = msg.user_id === currentUser?.id; return `<div class="message ${isOwn ? 'own' : ''}" style="display:flex; gap:10px; ${isOwn ? 'justify-content:flex-end' : ''}"><img src="${msg.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(msg.user_name)}" style="width:32px;height:32px;border-radius:50%;"><div><div style="font-size:12px; opacity:0.7;">${escapeHtml(msg.user_name)}</div><div class="message-bubble">${highlightMentions(escapeHtml(msg.text))}</div></div></div>`; }).join(''); container.scrollTop = container.scrollHeight; }
    
    async function createPoll() { const q = document.getElementById('pollQuestion').value.trim(); const opts = Array.from(document.querySelectorAll('#pollOptionsContainer .pollOption')).map(inp=>inp.value.trim()).filter(v=>v); if(!q || opts.length<2) { showNotification('Вопрос и 2+ варианта'); return; } const poll = { id: Date.now(), question: q, options: opts, votes: {}, created_by: currentUser.id, created_by_name: currentUser.full_name, is_active: true, created_at: new Date() }; const { error } = await supabase.from('polls').insert(poll); if(!error) { closePollModal(); showNotification(`Опрос "${q}" создан`); await supabase.from('messages').insert([{ user_id: 'system', user_name: 'Система', text: `📊 НОВЫЙ ОПРОС: "${q}"`, created_at: new Date() }]); if(!userCreatedPoll) { userCreatedPoll = true; await saveUserData(); } await loadPolls(); } else showNotification('Ошибка'); }
    async function votePoll(pollId, optIdx) { const poll = activePolls.find(p=>p.id===pollId); if(!poll) return; let votes = poll.votes || {}; for(let k in votes) { const idx = votes[k]?.indexOf(currentUser.id); if(idx !== -1) votes[k].splice(idx,1); } if(!votes[optIdx]) votes[optIdx] = []; votes[optIdx].push(currentUser.id); await supabase.from('polls').update({ votes }).eq('id', pollId); await loadPolls(); showNotification('Голос учтён'); }
    function renderActivePolls() { const div = document.getElementById('activePollsList'); if(!div) return; if(activePolls.length===0) { div.innerHTML = '<div style="opacity:0.6;">Нет активных опросов</div>'; return; } div.innerHTML = activePolls.map(poll => { const votes = poll.votes||{}; const total = Object.values(votes).reduce((s,arr)=>s+arr.length,0); return `<div class="poll-card"><div style="font-weight:bold;">❓ ${escapeHtml(poll.question)}</div>${poll.options.map((opt,idx)=>{ const cnt = votes[idx]?.length||0; const perc = total? (cnt/total*100).toFixed(0):0; return `<div style="margin:8px 0; cursor:pointer;" onclick="votePoll(${poll.id},${idx})"><div style="background:#2a3a5a; border-radius:30px; overflow:hidden;"><div style="width:${perc}%; background:#3b82f6; padding:6px 12px;">${escapeHtml(opt)} (${cnt} ${perc}%)</div></div></div>`; }).join('')}<div style="font-size:11px;">Создал: ${escapeHtml(poll.created_by_name)}</div></div>`; }).join(''); }
    
    function updateOnlineStatus() { const now = Date.now(); onlineUsers.clear(); allUsers.forEach(u=>{ if(u.last_seen && (now-u.last_seen)<120000) onlineUsers.set(u.id,u); }); if(currentUser && !onlineUsers.has(currentUser.id)) onlineUsers.set(currentUser.id, {...currentUser, last_seen:now, location:currentLocation, on_break:isOnBreak}); renderUserLists(); }
    function renderUserLists() { const online = Array.from(onlineUsers.values()); document.getElementById('onlineCount').innerText = online.length; const locs = { 'В колледже': document.getElementById('locationCollege'), 'В кофе': document.getElementById('locationCoffee'), 'В ПК клубе': document.getElementById('locationPc') }; Object.values(locs).forEach(l=>l.innerHTML=''); online.forEach(u=>{ const div = `<div class="user-chip" onclick="mentionUser('${u.full_name}')"><span class="status-dot-small" style="background:${u.on_break?'#f39c12':'#2ecc71'}"></span><img src="${u.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(u.full_name)}"><span>${escapeHtml(u.full_name)}</span></div>`; if(locs[u.location]) locs[u.location].innerHTML += div; }); document.getElementById('onlineList').innerHTML = online.map(u=>`<div class="user-chip" onclick="mentionUser('${u.full_name}')"><span class="status-dot-small" style="background:#2ecc71"></span><img src="${u.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(u.full_name)}">${escapeHtml(u.full_name)}</div>`).join(''); const offline = allUsers.filter(u=>!onlineUsers.has(u.id)&&u.id!==currentUser?.id); document.getElementById('offlineList').innerHTML = offline.map(u=>`<div class="user-chip"><span class="status-dot-small" style="background:#6c757d"></span><img src="${u.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(u.full_name)}">${escapeHtml(u.full_name)}</div>`).join(''); }
    function mentionUser(nm) { const inp = document.getElementById('messageInput'); inp.value = inp.value + `@${nm.split(' ')[0]} `; inp.focus(); }
    function renderTopStudents() { const ranking = allUsers.map(u=>({ id:u.id, name:u.full_name, points:calculatePoints(u.study_seconds||0, u.messages_count||0, u.current_streak||1) })).sort((a,b)=>b.points-a.points); const top3 = ranking.slice(0,3); document.getElementById('topStudentsList').innerHTML = top3.map((s,i)=>`<div class="top-student-modern"><span style="font-size:26px;">${i===0?'🥇':i===1?'🥈':'🥉'}</span><span style="flex:1; font-weight:600;">${escapeHtml(s.name)}</span><span>🏆 ${s.points}</span></div>`).join(''); const full = document.getElementById('fullRatingList'); if(full) full.innerHTML = ranking.map((s,i)=>`<div class="student-row ${s.id===currentUser?.id?'current-user-highlight':''}"><span>#${i+1}</span><span>${escapeHtml(s.name)}</span><span>${s.points} pts</span></div>`).join(''); const cur = ranking.findIndex(s=>s.id===currentUser?.id)+1; document.getElementById('personalStats').innerHTML = `📍 Место #${cur} · ${getTitle(calculatePoints(totalSeconds, userMessagesCount, userCurrentStreak))}<br>⏱️ ${Math.floor(totalSeconds/3600)}ч ${Math.floor((totalSeconds%3600)/60)}мин · 💬 ${userMessagesCount}<br>🔥 Стрик ${userCurrentStreak}д · ⭐ ${calculatePoints(totalSeconds, userMessagesCount, userCurrentStreak)} очков`; }
    function updateTimerDisplay() { const h = Math.floor(totalSeconds/3600); const m = Math.floor((totalSeconds%3600)/60); document.getElementById('studyTimer').innerHTML = `⏱️ ${h}ч ${m}м`; }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(async()=>{ if(!isOnBreak) { totalSeconds++; if(userMaxSessionDuration < (totalSeconds%86400)) userMaxSessionDuration = totalSeconds%86400; updateTimerDisplay(); await saveUserData(); } },1000); }
    
    async function initApp(user) { currentUser = { id:user.id, email:user.email, full_name:user.user_metadata?.full_name||user.email.split('@')[0], avatar_url:user.user_metadata?.avatar_url, last_seen:Date.now() }; document.getElementById('userName').innerText = currentUser.full_name; document.getElementById('userAvatar').src = currentUser.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.full_name)}&background=3b82f6&color=fff`; await loadProfiles(); await loadMessages(); await loadPolls(); await loadUserProfile(); await loadUserAchievements(); await updateProfile(); updateOnlineStatus(); startTimer(); userTotalSessions++; sessionStartHour = new Date().getHours(); await saveUserData(); document.getElementById('locationSelect').onchange = async(e)=>{ currentLocation = e.target.value; await updateProfile(); updateOnlineStatus(); }; document.getElementById('breakBtn').onclick = async()=>{ isOnBreak = !isOnBreak; document.getElementById('breakBtn').textContent = isOnBreak ? '▶ Вернуться' : '⏸ Перерыв'; document.getElementById('statusDot').className = isOnBreak ? 'break-dot' : 'online-dot'; document.getElementById('statusText').innerText = isOnBreak ? 'Перерыв' : 'Онлайн'; await updateProfile(); updateOnlineStatus(); }; document.getElementById('fullRankBtn').onclick = ()=>document.getElementById('fullRatingModal').style.display='flex'; document.getElementById('createPollHeaderBtn').onclick = ()=>document.getElementById('createPollModal').style.display='flex'; supabase.channel('public').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, async(p)=>{ messages.push(p.new); renderMessages(); if(p.new.mentions?.includes(currentUser.id)) showNotification(`🔔 Вас упомянули в чате`); }).subscribe(); supabase.channel('polls').on('postgres_changes', {event:'*', schema:'public', table:'polls'}, ()=>loadPolls()).subscribe(); setInterval(async()=>{ await loadProfiles(); updateOnlineStatus(); }, 8000); }
    
    function closeModal() { document.getElementById('fullRatingModal').style.display='none'; }
    function closePollModal() { document.getElementById('createPollModal').style.display='none'; document.getElementById('pollQuestion').value=''; document.getElementById('pollOptionsContainer').innerHTML=`<div class="option-input"><input type="text" placeholder="Вариант 1" class="pollOption"></div><div class="option-input"><input type="text" placeholder="Вариант 2" class="pollOption"></div>`; }
    function addPollOption() { const cont = document.getElementById('pollOptionsContainer'); const div = document.createElement('div'); div.className = 'option-input'; div.innerHTML = '<input type="text" placeholder="Новый вариант" class="pollOption" style="background:#0f172f;border-radius:28px;padding:10px; margin-top:8px;">'; cont.appendChild(div); }
    
    document.getElementById('loginBtn').onclick = ()=> supabase.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:window.location.href } });
    document.getElementById('logoutBtn')?.addEventListener('click', async()=>{ if(timerInterval) clearInterval(timerInterval); await supabase.auth.signOut(); location.reload(); });
    async function checkSession() { const { data } = await supabase.auth.getSession(); if(data.session) { document.getElementById('loginContainer').style.display='none'; document.getElementById('mainApp').style.display='block'; initApp(data.session.user); } else { document.getElementById('loginContainer').style.display='flex'; document.getElementById('mainApp').style.display='none'; } }
    supabase.auth.onAuthStateChange(()=> checkSession());
    window.votePoll = votePoll; window.createPoll = createPoll; window.addPollOption = addPollOption; window.closeModal = closeModal; window.closePollModal = closePollModal; window.mentionUser = mentionUser; window.sendMessage = sendMessage;
    checkSession();
</script>
</body>
</html>

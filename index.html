<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #357ae8;
            transform: translateY(-2px);
        }

        .welcome-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 4px solid #667eea;
            object-fit: cover;
        }

        .user-name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .user-email {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #e84118;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="auth-container">
        <div class="container">
            <h1>🔐 Вход через Google</h1>
            <div class="subtitle">Войдите в свой аккаунт, чтобы продолжить</div>
            <button class="google-btn" id="btn">
                <span>G</span>
                Войти через Google
            </button>
        </div>
    </div>
    <div id="res"></div>
    
    <script>
        const sb = window.supabase.createClient(
            'https://xwmckxrikcfalulwkhii.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bWNreHJpa2NmYWx1bHdraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjM3MTUsImV4cCI6MjA5MTE5OTcxNX0.8c5ty2PB2bsAwUk0ZoiY0g0dk-KIws7h4UT1MESSaGY'
        );
        
        const authContainer = document.getElementById('auth-container');
        const btn = document.getElementById('btn');
        const resDiv = document.getElementById('res');
        
        btn.onclick = () => {
            sb.auth.signInWithOAuth({ 
                provider: 'google',
                options: {
                    redirectTo: 'https://kqwezshadow.github.io/shadow/'
                }
            });
        };
        
        async function checkSession() {
            const { data } = await sb.auth.getSession();
            
            if(data.session) {
                authContainer.style.display = 'none';
                
                // Берём данные из user_metadata (Google сам их передаёт)
                const userName = data.session.user.user_metadata?.full_name || data.session.user.user_metadata?.name || 'Пользователь';
                const avatarUrl = data.session.user.user_metadata?.avatar_url || data.session.user.user_metadata?.picture;
                const userEmail = data.session.user.email;
                
                resDiv.innerHTML = `
                    <div class="welcome-box">
                        ${avatarUrl ? 
                            `<img src="${avatarUrl}" class="avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=667eea&color=fff'">` : 
                            `<div class="avatar" style="background: #667eea; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white;">${userName.charAt(0).toUpperCase()}</div>`
                        }
                        <div class="user-name">${userName}</div>
                        <div class="user-email">${userEmail}</div>
                        <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
                    </div>
                `;
                
                document.getElementById('logoutBtn').onclick = () => {
                    sb.auth.signOut().then(() => {
                        location.reload();
                    });
                };
            }
        }
        
        checkSession();
        
        sb.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN') {
                checkSession();
            }
        });
    </script>
</body>
</html>

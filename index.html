<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход через Google - Supabase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            background: #3367d6;
        }
        .user-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        .logout-btn {
            background: #dc3545;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>🔐 Вход через Google</h1>
        <p>Используйте свой Google аккаунт для входа</p>
        
        <button id="loginBtn">
            <span>📱</span> Войти через Google
        </button>
        
        <div id="userInfo" class="user-info" style="display: none;"></div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        // Данные вашего Supabase проекта
        const SUPABASE_URL = 'https://xwmckxrikcfalulwkhii.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bWNreHJpa2NmYWx1bHdraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjM3MTUsImV4cCI6MjA5MTE5OTcxNX0.8c5ty2PB2bsAwUk0ZoiY0g0dk-KIws7h4UT1MESSaGY';
        
        // ГЛАВНОЕ: используем ДРУГОЕ имя переменной (НЕ supabase)
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Получаем элементы
        const loginBtn = document.getElementById('loginBtn');
        const userInfoDiv = document.getElementById('userInfo');
        const errorMsgDiv = document.getElementById('errorMsg');
        
        // Функция входа через Google
        async function signInWithGoogle() {
            try {
                const { data, error } = await sbClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + window.location.pathname
                    }
                });
                
                if (error) throw error;
            } catch (error) {
                console.error('Ошибка входа:', error);
                errorMsgDiv.textContent = 'Ошибка входа: ' + error.message;
            }
        }
        
        // Функция выхода
        async function signOut() {
            try {
                const { error } = await sbClient.auth.signOut();
                if (error) throw error;
                location.reload();
            } catch (error) {
                console.error('Ошибка выхода:', error);
                errorMsgDiv.textContent = 'Ошибка выхода: ' + error.message;
            }
        }
        
        // Функция отображения информации о пользователе
        function displayUserInfo(user) {
            userInfoDiv.style.display = 'block';
            userInfoDiv.innerHTML = `
                <strong>✅ Вы вошли!</strong><br>
                📧 Email: ${user.email}<br>
                🆔 ID: ${user.id.substring(0, 20)}...<br>
                📅 Создан: ${new Date(user.created_at).toLocaleDateString()}<br>
                <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
            `;
            
            document.getElementById('logoutBtn').onclick = signOut;
            loginBtn.style.display = 'none';
        }
        
        // Проверяем текущую сессию при загрузке страницы
        async function checkSession() {
            try {
                const { data: { session }, error } = await sbClient.auth.getSession();
                
                if (error) throw error;
                
                if (session) {
                    displayUserInfo(session.user);
                } else {
                    loginBtn.style.display = 'inline-flex';
                    userInfoDiv.style.display = 'none';
                }
            } catch (error) {
                console.error('Ошибка проверки сессии:', error);
                errorMsgDiv.textContent = 'Ошибка проверки сессии: ' + error.message;
            }
        }
        
        // Обработчик кнопки входа
        loginBtn.onclick = signInWithGoogle;
        
        // Проверяем сессию при загрузке страницы
        checkSession();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kqwez | Dota Community (без Storage)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f12;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .container {
            width: 100%;
            max-width: 580px;
            background: #1a1a1f;
            padding: 24px;
            border-radius: 24px;
            margin-bottom: 24px;
            border: 1px solid #2c2c32;
        }
        .auth-bar {
            background: #14141a;
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff7b2c;
        }
        input, textarea {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: 1px solid #2c2c32;
            border-radius: 20px;
            background: #0a0a0e;
            color: #e0e0e6;
        }
        button {
            background: #ff7b2c;
            color: #0a0a0e;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .logout-btn {
            background: #c2410c;
            color: white;
            width: auto;
            padding: 8px 20px;
        }
        .post {
            background: #1a1a1f;
            border: 1px solid #2c2c32;
            padding: 18px;
            margin-top: 18px;
            border-radius: 24px;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }
        .post-user-name { font-weight: 700; color: #ffb347; }
        .time { font-size: 0.7rem; color: #8e8e9e; margin-left: auto; }
        .post-text { margin: 12px 0; color: #cdcddf; }
        .post-image {
            max-width: 100%;
            border-radius: 16px;
            margin: 12px 0;
            cursor: pointer;
        }
        .like-btn {
            background: #25252c;
            color: #ffb347;
            padding: 8px 18px;
            border-radius: 40px;
            width: auto;
            border: 1px solid #3a3a44;
        }
        .brand { font-weight: 800; font-size: 1.8rem; color: #ff7b2c; }
        .sub-brand { color: #8e8e9e; font-size: 0.8rem; }
        .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .image-preview {
            margin: 10px 0;
            position: relative;
            display: inline-block;
        }
        .image-preview img { max-width: 100%; max-height: 200px; border-radius: 12px; }
        .remove-image {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #c2410c;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }
        .file-input-label {
            background: #25252c;
            padding: 10px 16px;
            border-radius: 40px;
            cursor: pointer;
            color: #ffb347;
            border: 1px solid #3a3a44;
        }
        input[type="file"] { display: none; }
        .info-message {
            text-align: center;
            padding: 32px;
            background: #1a1a1f;
            border-radius: 32px;
            color: #8e8e9e;
        }
        .size-warning {
            font-size: 0.7rem;
            color: #ffb347;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div style="width:100%; max-width:580px;">
    <div class="brand">⚔️ kqwez pl</div>
    <p class="sub-brand">дота общество (без Storage, картинки в Firestore)</p>
</div>

<div id="authSection" class="container">
    <div id="loginButtonWrapper">
        <button id="demoLoginBtn">🔥 Войти в дота общество</button>
    </div>
    <div id="userInfoPanel" style="display: none;">
        <div class="auth-bar">
            <img id="userPhoto" class="user-avatar" src="">
            <span id="userDisplayName" style="flex:1; color:#ffb347;"></span>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
    </div>
</div>

<div id="messageForm" class="container" style="display: none;">
    <h3 style="color:#ffb347;">💬 Новая запись</h3>
    <input type="text" id="nameField" placeholder="Ваше имя">
    <textarea id="contentInput" rows="3" placeholder="Поделись мыслью о доте..."></textarea>
    
    <div class="flex-row" style="margin: 10px 0;">
        <label class="file-input-label">
            📷 Прикрепить картинку
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp">
        </label>
        <span id="fileName" style="color:#8e8e9e; font-size:0.8rem;"></span>
    </div>
    <div class="size-warning">⚠️ Картинки хранятся в Firestore (макс. 1 МБ, рекомендуется сжимать)</div>
    
    <div id="imagePreview" style="display: none;" class="image-preview">
        <img id="previewImg" src="" alt="Preview">
        <button id="removeImageBtn" class="remove-image">×</button>
    </div>
    
    <button id="publishBtn">📢 Опубликовать в чат</button>
</div>

<div id="feed"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
        serverTimestamp, updateDoc, doc, increment 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1FadsdnN8ZnKkdgYKqfMIOgxyph5zM3A",
        authDomain: "kqwez-token.firebaseapp.com",
        projectId: "kqwez-token",
        storageBucket: "kqwez-token.firebasestorage.app",
        messagingSenderId: "508135236384",
        appId: "1:508135236384:web:75514deba078c0dabfad45",
        measurementId: "G-KS7JWV33JS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentDemoUser = null;
    let selectedImageDataURL = null;
    
    const loginButtonWrapper = document.getElementById('loginButtonWrapper');
    const userInfoPanel = document.getElementById('userInfoPanel');
    const messageForm = document.getElementById('messageForm');
    const userPhoto = document.getElementById('userPhoto');
    const userDisplayName = document.getElementById('userDisplayName');
    const nameField = document.getElementById('nameField');
    const contentInput = document.getElementById('contentInput');
    const publishBtn = document.getElementById('publishBtn');
    const feedContainer = document.getElementById('feed');
    const demoLoginBtn = document.getElementById('demoLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const fileNameSpan = document.getElementById('fileName');

    let unsubscribeSnapshot = null;

    // Сжатие изображения перед сохранением
    function compressImage(file, maxSizeMB = 0.8) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxWidth = 800;
                    
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Сжатие до 0.8 МБ
                    const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(dataURL);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
            try {
                fileNameSpan.textContent = "Сжатие...";
                const compressedDataURL = await compressImage(file, 0.8);
                selectedImageDataURL = compressedDataURL;
                previewImg.src = compressedDataURL;
                imagePreview.style.display = 'block';
                fileNameSpan.textContent = file.name + " (сжато)";
            } catch (err) {
                alert("Ошибка обработки изображения");
                console.error(err);
            }
        }
    });

    removeImageBtn.addEventListener('click', () => {
        selectedImageDataURL = null;
        imageInput.value = '';
        fileNameSpan.textContent = '';
        imagePreview.style.display = 'none';
        previewImg.src = '';
    });

    function startRealtimeFeed() {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
            if (!feedContainer) return;
            feedContainer.innerHTML = "";
            if (snapshot.empty) {
                feedContainer.innerHTML = `<div class="info-message">💀 Пока тихо... Напиши что-нибудь про доту или кинь картинку!</div>`;
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const likesCount = data.likes ?? 0;
                const userName = data.name || "Аноним";
                const userPhotoURL = data.photo || `https://ui-avatars.com/api/?background=ff7b2c&color=0a0a0e&bold=true&size=40&name=${encodeURIComponent(userName)}`;
                const postText = data.text || "";
                const imageDataURL = data.imageDataURL || null;
                const timestampRaw = data.timestamp;
                
                let formattedTime = "только что";
                if (timestampRaw?.toDate) {
                    formattedTime = timestampRaw.toDate().toLocaleString('ru-RU', { hour: '2-digit', minute:'2-digit', day:'numeric', month:'short' });
                }
                
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                
                let imageHtml = '';
                if (imageDataURL) {
                    imageHtml = `<img class="post-image" src="${escapeHtml(imageDataURL)}" alt="post image" onclick="window.openModal('${escapeHtml(imageDataURL)}')">`;
                }
                
                postDiv.innerHTML = `
                    <div class="post-header">
                        <img class="post-avatar" src="${escapeHtml(userPhotoURL)}">
                        <span class="post-user-name">${escapeHtml(userName)}</span>
                        <span class="time">🕒 ${escapeHtml(formattedTime)}</span>
                    </div>
                    ${postText ? `<div class="post-text">${escapeHtml(postText)}</div>` : ''}
                    ${imageHtml}
                    <div class="flex-row">
                        <button class="like-btn" data-id="${docId}">❤️ ${likesCount} · Плюсануть</button>
                    </div>
                `;
                
                const likeButton = postDiv.querySelector('.like-btn');
                likeButton.addEventListener('click', async () => {
                    try {
                        await updateDoc(doc(db, "requests", docId), { likes: increment(1) });
                    } catch (err) {
                        alert("Ошибка лайка: " + err.message);
                    }
                });
                
                feedContainer.appendChild(postDiv);
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.openModal = (url) => {
        const modal = document.createElement('div');
        modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; display:flex; align-items:center; justify-content:center; cursor:pointer;";
        modal.onclick = () => modal.remove();
        const img = document.createElement('img');
        img.src = url;
        img.style.maxWidth = "90%";
        img.style.maxHeight = "90%";
        modal.appendChild(img);
        document.body.appendChild(modal);
    };

    demoLoginBtn.onclick = () => {
        const demoName = prompt("Введите ваше имя для чата:", "DotaPlayer");
        if (demoName && demoName.trim()) {
            currentDemoUser = {
                displayName: demoName.trim(),
                email: `${demoName.trim().toLowerCase()}@demo.kqwez`,
                photoURL: `https://ui-avatars.com/api/?background=ff7b2c&color=0a0a0e&bold=true&size=44&name=${encodeURIComponent(demoName.trim())}`
            };
            loginButtonWrapper.style.display = 'none';
            userInfoPanel.style.display = 'block';
            messageForm.style.display = 'block';
            userDisplayName.innerText = currentDemoUser.displayName;
            userPhoto.src = currentDemoUser.photoURL;
            nameField.value = currentDemoUser.displayName;
            startRealtimeFeed();
        }
    };

    logoutBtn.onclick = () => {
        currentDemoUser = null;
        loginButtonWrapper.style.display = 'block';
        userInfoPanel.style.display = 'none';
        messageForm.style.display = 'none';
        if (unsubscribeSnapshot) {
            unsubscribeSnapshot();
            unsubscribeSnapshot = null;
        }
        feedContainer.innerHTML = `<div class="info-message">🔐 Войдите, чтобы начать общаться в чате</div>`;
        selectedImageDataURL = null;
        imageInput.value = '';
        imagePreview.style.display = 'none';
    };

    publishBtn.onclick = async () => {
        if (!currentDemoUser) {
            alert("Сначала войдите в чат!");
            return;
        }
        
        const postContent = contentInput.value.trim();
        if (!postContent && !selectedImageDataURL) {
            alert("Напиши что-нибудь или прикрепи картинку!");
            return;
        }
        
        const userName = nameField.value.trim() || currentDemoUser.displayName;
        
        publishBtn.disabled = true;
        publishBtn.innerText = "Публикация...";
        
        try {
            await addDoc(collection(db, "requests"), {
                name: userName,
                email: currentDemoUser.email,
                photo: currentDemoUser.photoURL,
                text: postContent,
                imageDataURL: selectedImageDataURL,
                likes: 0,
                timestamp: serverTimestamp()
            });
            
            contentInput.value = "";
            selectedImageDataURL = null;
            imageInput.value = '';
            fileNameSpan.textContent = '';
            imagePreview.style.display = 'none';
            previewImg.src = '';
            
            alert("✅ Пост опубликован!");
            
        } catch (error) {
            console.error("Ошибка:", error);
            alert("❌ Ошибка: " + error.message);
        } finally {
            publishBtn.disabled = false;
            publishBtn.innerText = "📢 Опубликовать в чат";
        }
    };

    startRealtimeFeed();
    console.log("🔥 kqwez pl — без Storage, картинки в Firestore (DataURL)");
</script>
</body>
</html>

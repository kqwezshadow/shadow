<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Qazaq Connect | Образовательная платформа</title>
    <!-- Подключаем шрифт Inter для современного вида -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            min-height: 100vh;
        }

        /* основной контейнер для блоков */
        .container {
            width: 100%;
            max-width: 580px;
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        /* панель авторизации (гибкая) */
        .auth-bar {
            background: white;
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f6;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1e6f3f;
            background: #e9ecef;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0 8px 0;
            border: 1px solid #e0e4e8;
            border-radius: 20px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            transition: 0.2s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #1e6f3f;
            box-shadow: 0 0 0 3px rgba(30, 111, 63, 0.15);
        }

        button {
            background: #1e6f3f;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: #0f5431;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .logout-btn {
            background: #e74c3c;
            padding: 8px 20px;
            width: auto;
            font-size: 0.85rem;
            border-radius: 40px;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .post {
            background: #ffffff;
            border: 1px solid #edf2f7;
            padding: 18px;
            margin-top: 18px;
            border-radius: 24px;
            width: 100%;
            max-width: 580px;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #dee2e6;
            border: 1px solid #e2e8f0;
        }

        .post-user-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1a2c3e;
        }

        .time {
            font-size: 0.7rem;
            color: #8e9eae;
            margin-left: auto;
        }

        .post-text {
            font-size: 0.95rem;
            line-height: 1.45;
            margin: 12px 0 12px 0;
            color: #1f2a3a;
            word-break: break-word;
        }

        .like-btn {
            background: #f1f5f9;
            color: #2c3e50;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            width: auto;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            cursor: pointer;
        }

        .like-btn:hover {
            background: #ffe6e6;
            color: #c0392b;
        }

        .like-btn.liked {
            background: #ffebee;
            color: #e74c3c;
        }

        #feed {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-message {
            text-align: center;
            padding: 32px 20px;
            background: #ffffffdd;
            border-radius: 32px;
            color: #5a6e7c;
            font-size: 0.9rem;
        }

        hr {
            margin: 8px 0;
            border-color: #ecf0f1;
        }

        .readonly-input {
            background: #f8fafc;
            color: #2d3e50;
            font-weight: 500;
        }

        .brand {
            font-weight: 700;
            font-size: 1.35rem;
            color: #1e6f3f;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div style="width:100%; max-width:580px; margin-bottom:8px;">
    <div class="brand">🌿 Qazaq Bilim</div>
    <p style="color:#5f7f6e; font-size:0.8rem;">Образовательное пространство · Делитесь мыслями</p>
</div>

<!-- Секция авторизации (динамическая) -->
<div id="authSection" class="container" style="padding: 12px 20px;">
    <div id="loginButtonWrapper" style="text-align: center;">
        <button id="loginBtn" style="background: #4285F4; display: flex; align-items: center; justify-content: center; gap: 10px;">
            🔑 Войти через Google
        </button>
    </div>
    <div id="userInfoPanel" style="display: none;">
        <div class="auth-bar">
            <img id="userPhoto" class="user-avatar" src="" alt="avatar">
            <span id="userDisplayName" style="font-weight: 600; flex:1;"></span>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
    </div>
</div>

<!-- Форма создания записи (доступна только авторизованным) -->
<div id="messageForm" class="container" style="display: none;">
    <h3 style="margin-bottom: 12px; font-weight: 600;">✍️ Новая запись</h3>
    <input type="text" id="nameField" placeholder="Имя" readonly class="readonly-input">
    <input type="email" id="emailField" placeholder="Email" readonly class="readonly-input">
    <textarea id="contentInput" rows="3" placeholder="Поделитесь мыслью или образовательной заметкой..." style="resize: vertical;"></textarea>
    <button id="publishBtn">📤 Опубликовать в облако</button>
</div>

<!-- Лента постов -->
<div id="feed"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
        serverTimestamp, updateDoc, doc, increment 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { 
        getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // Firebase конфигурация (из вашего проекта)
    const firebaseConfig = {
        apiKey: "AIzaSyDgJxK8I1XaFc_qa-rpdS2kKt32651fxuM",
        authDomain: "qazaq-a072e.firebaseapp.com",
        projectId: "qazaq-a072e",
        storageBucket: "qazaq-a072e.firebasestorage.app",
        messagingSenderId: "47025480990",
        appId: "1:47025480990:web:3dd74ff29bc0149f39a23",
        measurementId: "G-9TE97MM09"
    };

    // Инициализация
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // DOM элементы
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfoPanel = document.getElementById('userInfoPanel');
    const loginButtonWrapper = document.getElementById('loginButtonWrapper');
    const messageForm = document.getElementById('messageForm');
    const userPhoto = document.getElementById('userPhoto');
    const userDisplayName = document.getElementById('userDisplayName');
    const nameField = document.getElementById('nameField');
    const emailField = document.getElementById('emailField');
    const publishBtn = document.getElementById('publishBtn');
    const contentInput = document.getElementById('contentInput');
    const feedContainer = document.getElementById('feed');

    // --- Флаг для избежания двойной подписки (onSnapshot) --
    let unsubscribeSnapshot = null;

    // --- Функция загрузки постов в реальном времени (Firestore) ---
    function startRealtimeFeed() {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
            if (!feedContainer) return;
            feedContainer.innerHTML = "";
            
            if (snapshot.empty) {
                feedContainer.innerHTML = `<div class="info-message">✨ Пока нет записей. Будьте первым, кто поделится мыслью!</div>`;
                return;
            }
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const likesCount = data.likes ?? 0;
                const userName = data.name || "Аноним";
                const userEmail = data.email || "";
                const userPhotoURL = data.photo || "https://ui-avatars.com/api/?background=1e6f3f&color=fff&bold=true&size=40&name=" + encodeURIComponent(userName);
                const postText = data.text || (data.content || "—");
                const timestampRaw = data.timestamp;
                
                let formattedTime = "только что";
                if (timestampRaw && timestampRaw.toDate) {
                    const dateObj = timestampRaw.toDate();
                    formattedTime = dateObj.toLocaleString('ru-RU', { hour: '2-digit', minute:'2-digit', day:'numeric', month:'short' });
                } else if (timestampRaw && typeof timestampRaw === 'string') {
                    formattedTime = timestampRaw;
                }
                
                // Создаём карточку поста (безопасная вёрстка, но фото через атрибуты)
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <div class="post-header">
                        <img class="post-avatar" src="${escapeHtml(userPhotoURL)}" alt="avatar" onerror="this.src='https://ui-avatars.com/api/?background=9aa9b1&color=fff&bold=true&size=40&name=?'">
                        <span class="post-user-name">${escapeHtml(userName)}</span>
                        <span class="time">📅 ${escapeHtml(formattedTime)}</span>
                    </div>
                    <div class="post-text">${escapeHtml(postText)}</div>
                    <div class="flex-row" style="justify-content: flex-start;">
                        <button class="like-btn" data-id="${docId}">❤️ ${likesCount} · Нравится</button>
                    </div>
                `;
                
                const likeButton = postDiv.querySelector('.like-btn');
                likeButton.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    try {
                        // Атомарное увеличение счётчика лайков
                        await updateDoc(doc(db, "requests", docId), {
                            likes: increment(1)
                        });
                        // Небольшая анимация обратной связи
                        likeButton.style.transform = "scale(0.96)";
                        setTimeout(() => { likeButton.style.transform = ""; }, 150);
                    } catch (err) {
                        console.error("Ошибка лайка:", err);
                        alert("Не удалось поставить лайк. Проверьте интернет и правила безопасности Firebase.");
                    }
                });
                
                feedContainer.appendChild(postDiv);
            });
        }, (error) => {
            console.error("Ошибка при получении ленты:", error);
            if (feedContainer) {
                feedContainer.innerHTML = `<div class="info-message">⚠️ Не удалось загрузить ленту. Проверьте подключение или правила Firestore.</div>`;
            }
        });
    }
    
    // Простая функция для защиты от XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // --- Обработка изменения состояния аутентификации ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Авторизован: показываем панель пользователя, скрываем кнопку входа
            loginButtonWrapper.style.display = 'none';
            userInfoPanel.style.display = 'block';
            messageForm.style.display = 'block';
            
            // Заполняем данные пользователя
            const displayName = user.displayName || user.email?.split('@')[0] || "Учитель";
            const photo = user.photoURL || "";
            const email = user.email || "";
            
            userDisplayName.innerText = displayName;
            if (photo) {
                userPhoto.src = photo;
            } else {
                userPhoto.src = "https://ui-avatars.com/api/?background=2c6e49&color=fff&bold=true&size=44&name=" + encodeURIComponent(displayName);
            }
            userPhoto.alt = displayName;
            
            // Заполняем поля формы (readonly)
            nameField.value = displayName;
            emailField.value = email;
            
            // Запускаем / перезапускаем ленту (чтобы быть уверенными)
            startRealtimeFeed();
            
        } else {
            // Не авторизован: скрываем форму и панель пользователя, показываем кнопку входа
            loginButtonWrapper.style.display = 'block';
            userInfoPanel.style.display = 'none';
            messageForm.style.display = 'none';
            
            // Очищаем ленту, показываем приглашение
            if (feedContainer) {
                feedContainer.innerHTML = `<div class="info-message">🔐 Войдите через Google, чтобы читать и публиковать записи в образовательном сообществе.</div>`;
            }
            
            // Отписываемся от snapshot'ов, чтобы не было ошибок доступа
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                unsubscribeSnapshot = null;
            }
        }
    });
    
    // --- Логин через Google ---
    loginBtn.onclick = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            console.log("Успешный вход:", result.user.displayName);
        } catch (error) {
            console.error("Ошибка входа:", error);
            if (error.code === 'auth/popup-blocked') {
                alert("Всплывающее окно заблокировано браузером. Разрешите всплывающие окна для этого сайта.");
            } else {
                alert("Не удалось войти. Попробуйте позже: " + error.message);
            }
        }
    };
    
    // --- Выход из аккаунта ---
    logoutBtn.onclick = async () => {
        try {
            await signOut(auth);
            console.log("Выход выполнен");
        } catch (err) {
            console.error("Ошибка выхода:", err);
        }
    };
    
    // --- Публикация новой записи (добавление документа в коллекцию requests) ---
    publishBtn.onclick = async () => {
        const currentUser = auth.currentUser;
        if (!currentUser) {
            alert("Необходимо войти в аккаунт, чтобы создать запись.");
            return;
        }
        
        const postContent = contentInput.value.trim();
        if (!postContent) {
            alert("Пожалуйста, напишите текст записи.");
            return;
        }
        
        // Блокируем кнопку на время отправки
        const originalText = publishBtn.innerText;
        publishBtn.innerText = "Отправка...";
        publishBtn.disabled = true;
        
        try {
            await addDoc(collection(db, "requests"), {
                name: currentUser.displayName || currentUser.email?.split('@')[0] || "Пользователь",
                email: currentUser.email,
                photo: currentUser.photoURL || "",
                text: postContent,
                likes: 0,
                timestamp: serverTimestamp()
            });
            // Очищаем поле ввода
            contentInput.value = "";
            // Лёгкое уведомление об успехе
            alert("✅ Запись опубликована в облаке!");
        } catch (error) {
            console.error("Ошибка при публикации:", error);
            alert("❌ Ошибка публикации. Проверьте правила безопасности Firestore: " + (error.message || "доступ запрещён"));
        } finally {
            publishBtn.innerText = originalText;
            publishBtn.disabled = false;
        }
    };
    
    // Добавляем небольшой эффект для авто-обновления формы при изменении пользователя (доп. страховка)
    window.addEventListener('load', () => {
        // Проверяем существующий сеанс при загрузке
        if (auth.currentUser) {
            // уже обработано onAuthStateChanged, но дублируем для формы
            nameField.value = auth.currentUser.displayName || "";
            emailField.value = auth.currentUser.email || "";
            if (userPhoto) userPhoto.src = auth.currentUser.photoURL || "";
            userDisplayName.innerText = auth.currentUser.displayName || auth.currentUser.email;
        } else {
            if (feedContainer && !unsubscribeSnapshot) {
                feedContainer.innerHTML = `<div class="info-message">📚 Войдите, чтобы видеть образовательную ленту сообщества.</div>`;
            }
        }
    });
    
    // дополнительно: если лента уже подписана, но пользователь вышел — корректно очищаем
    // Также прослушиваем изменения сети — для UX, но основная логика выше
    console.log("✅ Образовательное приложение загружено — авторизация, лайки, посты в реальном времени");
</script>
</body>
</html>

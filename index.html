<!DOCTYPE html>
<html>
<head>
    <title>Google Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Вход через Google</h1>
    <button id="btn">Войти</button>
    <div id="result"></div>

    <script>
        const supabase = window.supabase.createClient(
            'https://xwmckxrikcfalulwkhii.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bWNreHJpa2NmYWx1bHdraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjM3MTUsImV4cCI6MjA5MTE5OTcxNX0.8c5ty2PB2bsAwUk0ZoiY0g0dk-KIws7h4UT1MESSaGY'
        );

        document.getElementById('btn').onclick = function() {
            supabase.auth.signInWithOAuth({ provider: 'google' });
        };

        supabase.auth.getSession().then(({ data }) => {
            if (data.session) {
                document.getElementById('result').innerHTML = '✅ Вошел: ' + data.session.user.email;
            }
        });
    </script>
</body>
</html>

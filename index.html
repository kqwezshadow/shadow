<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>kqwez | Dota Community</title>
    <!-- Подключаем шрифт Inter для современного вида -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f12;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            min-height: 100vh;
        }

        /* основной контейнер для блоков */
        .container {
            width: 100%;
            max-width: 580px;
            background: #1a1a1f;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
            transition: all 0.2s ease;
            border: 1px solid #2c2c32;
        }

        /* панель авторизации (гибкая) */
        .auth-bar {
            background: #14141a;
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border: 1px solid #2c2c32;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff7b2c;
            background: #2a2a2f;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0 8px 0;
            border: 1px solid #2c2c32;
            border-radius: 20px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #0a0a0e;
            color: #e0e0e6;
            transition: 0.2s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #ff7b2c;
            box-shadow: 0 0 0 3px rgba(255, 123, 44, 0.2);
        }

        input::placeholder, textarea::placeholder {
            color: #5a5a66;
        }

        button {
            background: #ff7b2c;
            color: #0a0a0e;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: #ff944d;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .logout-btn {
            background: #c2410c;
            color: white;
            padding: 8px 20px;
            width: auto;
            font-size: 0.85rem;
            border-radius: 40px;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #9a3412;
        }

        .post {
            background: #1a1a1f;
            border: 1px solid #2c2c32;
            padding: 18px;
            margin-top: 18px;
            border-radius: 24px;
            width: 100%;
            max-width: 580px;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a2f;
            border: 1px solid #3a3a44;
        }

        .post-user-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffb347;
        }

        .time {
            font-size: 0.7rem;
            color: #8e8e9e;
            margin-left: auto;
        }

        .post-text {
            font-size: 0.95rem;
            line-height: 1.45;
            margin: 12px 0 12px 0;
            color: #cdcddf;
            word-break: break-word;
        }

        .like-btn {
            background: #25252c;
            color: #ffb347;
            border: 1px solid #3a3a44;
            padding: 8px 18px;
            border-radius: 40px;
            width: auto;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            cursor: pointer;
        }

        .like-btn:hover {
            background: #2f2f38;
            color: #ff7b2c;
            border-color: #ff7b2c;
        }

        #feed {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-message {
            text-align: center;
            padding: 32px 20px;
            background: #1a1a1f;
            border-radius: 32px;
            color: #8e8e9e;
            font-size: 0.9rem;
            border: 1px solid #2c2c32;
        }

        hr {
            margin: 8px 0;
            border-color: #2c2c32;
        }

        .readonly-input {
            background: #0f0f12;
            color: #b0b0c0;
            font-weight: 500;
            border-color: #2c2c32;
        }

        .brand {
            font-weight: 800;
            font-size: 1.8rem;
            color: #ff7b2c;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(255, 123, 44, 0.3);
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sub-brand {
            color: #8e8e9e;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div style="width:100%; max-width:580px; margin-bottom:12px;">
    <div class="brand">⚔️ kqwez pl</div>
    <p class="sub-brand">дота общество</p>
</div>

<!-- Секция авторизации (динамическая) -->
<div id="authSection" class="container" style="padding: 12px 20px;">
    <div id="loginButtonWrapper" style="text-align: center;">
        <button id="loginBtn" style="background: #ff7b2c; color: #0a0a0e; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700;">
            🔥 Войти через Google
        </button>
    </div>
    <div id="userInfoPanel" style="display: none;">
        <div class="auth-bar">
            <img id="userPhoto" class="user-avatar" src="" alt="avatar">
            <span id="userDisplayName" style="font-weight: 600; flex:1; color:#ffb347;"></span>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
    </div>
</div>

<!-- Форма создания записи (доступна только авторизованным) -->
<div id="messageForm" class="container" style="display: none;">
    <h3 style="margin-bottom: 12px; font-weight: 600; color:#ffb347;">💬 Новая запись</h3>
    <input type="text" id="nameField" placeholder="Имя" readonly class="readonly-input">
    <input type="email" id="emailField" placeholder="Email" readonly class="readonly-input">
    <textarea id="contentInput" rows="3" placeholder="Поделись мыслью о доте, мете, патчах или просто поболтай..." style="resize: vertical;"></textarea>
    <button id="publishBtn">📢 Опубликовать в чат</button>
</div>

<!-- Лента постов -->
<div id="feed"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
        serverTimestamp, updateDoc, doc, increment 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { 
        getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // Firebase конфигурация (из вашего проекта)
    const firebaseConfig = {
        apiKey: "AIzaSyDgJxK8I1XaFc_qa-rpdS2kKt32651fxuM",
        authDomain: "qazaq-a072e.firebaseapp.com",
        projectId: "qazaq-a072e",
        storageBucket: "qazaq-a072e.firebasestorage.app",
        messagingSenderId: "47025480990",
        appId: "1:47025480990:web:3dd74ff29bc0149f39a23",
        measurementId: "G-9TE97MM09"
    };

    // Инициализация
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // DOM элементы
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfoPanel = document.getElementById('userInfoPanel');
    const loginButtonWrapper = document.getElementById('loginButtonWrapper');
    const messageForm = document.getElementById('messageForm');
    const userPhoto = document.getElementById('userPhoto');
    const userDisplayName = document.getElementById('userDisplayName');
    const nameField = document.getElementById('nameField');
    const emailField = document.getElementById('emailField');
    const publishBtn = document.getElementById('publishBtn');
    const contentInput = document.getElementById('contentInput');
    const feedContainer = document.getElementById('feed');

    // --- Флаг для избежания двойной подписки (onSnapshot) --
    let unsubscribeSnapshot = null;

    // --- Функция загрузки постов в реальном времени (Firestore) ---
    function startRealtimeFeed() {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
            if (!feedContainer) return;
            feedContainer.innerHTML = "";
            
            if (snapshot.empty) {
                feedContainer.innerHTML = `<div class="info-message">💀 Пока тихо... Напиши что-нибудь про доту, замутим обсуждение!</div>`;
                return;
            }
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const likesCount = data.likes ?? 0;
                const userName = data.name || "Анонимный дотер";
                const userEmail = data.email || "";
                const userPhotoURL = data.photo || "https://ui-avatars.com/api/?background=ff7b2c&color=0a0a0e&bold=true&size=40&name=" + encodeURIComponent(userName);
                const postText = data.text || (data.content || "—");
                const timestampRaw = data.timestamp;
                
                let formattedTime = "только что";
                if (timestampRaw && timestampRaw.toDate) {
                    const dateObj = timestampRaw.toDate();
                    formattedTime = dateObj.toLocaleString('ru-RU', { hour: '2-digit', minute:'2-digit', day:'numeric', month:'short' });
                } else if (timestampRaw && typeof timestampRaw === 'string') {
                    formattedTime = timestampRaw;
                }
                
                // Создаём карточку поста
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <div class="post-header">
                        <img class="post-avatar" src="${escapeHtml(userPhotoURL)}" alt="avatar" onerror="this.src='https://ui-avatars.com/api/?background=8b5a2b&color=fff&bold=true&size=40&name=?'">
                        <span class="post-user-name">${escapeHtml(userName)}</span>
                        <span class="time">🕒 ${escapeHtml(formattedTime)}</span>
                    </div>
                    <div class="post-text">${escapeHtml(postText)}</div>
                    <div class="flex-row" style="justify-content: flex-start;">
                        <button class="like-btn" data-id="${docId}">❤️ ${likesCount} · Плюсануть</button>
                    </div>
                `;
                
                const likeButton = postDiv.querySelector('.like-btn');
                likeButton.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    try {
                        await updateDoc(doc(db, "requests", docId), {
                            likes: increment(1)
                        });
                        likeButton.style.transform = "scale(0.96)";
                        setTimeout(() => { likeButton.style.transform = ""; }, 150);
                    } catch (err) {
                        console.error("Ошибка лайка:", err);
                        alert("Не удалось поставить плюс. Проверь интернет и правила Firebase.");
                    }
                });
                
                feedContainer.appendChild(postDiv);
            });
        }, (error) => {
            console.error("Ошибка при получении чата:", error);
            if (feedContainer) {
                feedContainer.innerHTML = `<div class="info-message">⚠️ Не удалось загрузить сообщения. Проверь подключение или правила Firestore.</div>`;
            }
        });
    }
    
    // Простая функция для защиты от XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // --- Обработка изменения состояния аутентификации ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Авторизован: показываем панель пользователя, скрываем кнопку входа
            loginButtonWrapper.style.display = 'none';
            userInfoPanel.style.display = 'block';
            messageForm.style.display = 'block';
            
            // Заполняем данные пользователя
            const displayName = user.displayName || user.email?.split('@')[0] || "Dota player";
            const photo = user.photoURL || "";
            const email = user.email || "";
            
            userDisplayName.innerText = displayName;
            if (photo) {
                userPhoto.src = photo;
            } else {
                userPhoto.src = "https://ui-avatars.com/api/?background=ff7b2c&color=0a0a0e&bold=true&size=44&name=" + encodeURIComponent(displayName);
            }
            userPhoto.alt = displayName;
            
            // Заполняем поля формы (readonly)
            nameField.value = displayName;
            emailField.value = email;
            
            // Запускаем / перезапускаем ленту
            startRealtimeFeed();
            
        } else {
            // Не авторизован: скрываем форму и панель пользователя, показываем кнопку входа
            loginButtonWrapper.style.display = 'block';
            userInfoPanel.style.display = 'none';
            messageForm.style.display = 'none';
            
            // Очищаем ленту, показываем приглашение
            if (feedContainer) {
                feedContainer.innerHTML = `<div class="info-message">🔐 Войдите, чтобы начать общаться в чате</div>`;
            }
            
            // Отписываемся от snapshot'ов
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                unsubscribeSnapshot = null;
            }
        }
    });
    
    // --- Логин через Google ---
    loginBtn.onclick = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            console.log("Успешный вход:", result.user.displayName);
        } catch (error) {
            console.error("Ошибка входа:", error);
            if (error.code === 'auth/popup-blocked') {
                alert("Всплывающее окно заблокировано браузером. Разрешите всплывающие окна для этого сайта.");
            } else {
                alert("Не удалось войти. Попробуй позже: " + error.message);
            }
        }
    };
    
    // --- Выход из аккаунта ---
    logoutBtn.onclick = async () => {
        try {
            await signOut(auth);
            console.log("Выход выполнен");
        } catch (err) {
            console.error("Ошибка выхода:", err);
        }
    };
    
    // --- Публикация новой записи ---
    publishBtn.onclick = async () => {
        const currentUser = auth.currentUser;
        if (!currentUser) {
            alert("Нужно войти, чтобы писать в чат дота общества!");
            return;
        }
        
        const postContent = contentInput.value.trim();
        if (!postContent) {
            alert("Напиши что-нибудь про доту или просто поздоровайся 👾");
            return;
        }
        
        // Блокируем кнопку на время отправки
        const originalText = publishBtn.innerText;
        publishBtn.innerText = "Отправка...";
        publishBtn.disabled = true;
        
        try {
            await addDoc(collection(db, "requests"), {
                name: currentUser.displayName || currentUser.email?.split('@')[0] || "Dota enjoyer",
                email: currentUser.email,
                photo: currentUser.photoURL || "",
                text: postContent,
                likes: 0,
                timestamp: serverTimestamp()
            });
            contentInput.value = "";
            // Короткий фидбек
            const toastMsg = document.createElement('div');
            toastMsg.textContent = "✅ Сообщение ушло в чат!";
            toastMsg.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff7b2c; color:#0a0a0e; padding:8px 20px; border-radius:40px; font-weight:bold; z-index:1000; font-size:0.85rem;";
            document.body.appendChild(toastMsg);
            setTimeout(() => toastMsg.remove(), 2000);
        } catch (error) {
            console.error("Ошибка при публикации:", error);
            alert("❌ Ошибка отправки. Проверь правила безопасности Firestore: " + (error.message || "доступ запрещён"));
        } finally {
            publishBtn.innerText = originalText;
            publishBtn.disabled = false;
        }
    };
    
    // Инициализация при загрузке
    window.addEventListener('load', () => {
        if (auth.currentUser) {
            nameField.value = auth.currentUser.displayName || "";
            emailField.value = auth.currentUser.email || "";
            if (userPhoto) userPhoto.src = auth.currentUser.photoURL || "";
            userDisplayName.innerText = auth.currentUser.displayName || auth.currentUser.email;
        } else {
            if (feedContainer && !unsubscribeSnapshot) {
                feedContainer.innerHTML = `<div class="info-message">🔐 Войдите, чтобы начать общаться в чате</div>`;
            }
        }
    });
    
    console.log("🔥 kqwez pl — дота общество запущена!");
</script>
</body>
</html>

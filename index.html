<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топ студентов - Система достижений</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Профиль */
        .profile-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .profile-info h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .profile-info p {
            color: #aaa;
        }
        .stats {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #f5576c;
        }
        .stat-label {
            font-size: 12px;
            color: #aaa;
        }
        /* Рейтинг */
        .rating-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .rating-card h3 {
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .top-student {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .top-student .rank {
            font-size: 30px;
            font-weight: bold;
        }
        .top-student .name {
            font-size: 20px;
            font-weight: bold;
            flex: 1;
        }
        .top-student .points {
            font-size: 18px;
        }
        .student-row {
            background: rgba(0,0,0,0.3);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .student-row .rank {
            width: 40px;
            font-weight: bold;
            color: #ffd700;
        }
        .student-row .name {
            flex: 1;
            color: white;
        }
        .student-row .points {
            color: #f5576c;
            font-weight: bold;
        }
        .current-user {
            background: rgba(245,87,108,0.3);
            border: 1px solid #f5576c;
        }
        /* Достижения */
        .achievements-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .achievement {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        .achievement.locked {
            opacity: 0.5;
            filter: grayscale(0.3);
        }
        .achievement.unlocked {
            background: linear-gradient(135deg, rgba(0,255,0,0.2), rgba(0,200,0,0.1));
            border-left: 4px solid #00ff00;
        }
        .achievement-icon {
            font-size: 32px;
        }
        .achievement-info {
            flex: 1;
        }
        .achievement-name {
            font-weight: bold;
            color: white;
            font-size: 14px;
        }
        .achievement-desc {
            font-size: 11px;
            color: #aaa;
        }
        .achievement-rarity {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }
        .rarity-common { background: #6c757d; }
        .rarity-rare { background: #007bff; }
        .rarity-epic { background: #9b59b6; }
        .rarity-legendary { background: #f39c12; }
        /* Кнопка выхода */
        .logout-btn {
            background: #dc3545;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .login-container {
            text-align: center;
            padding: 50px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        .login-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div id="content"></div>
    </div>

    <script>
        // Supabase настройки
        const SUPABASE_URL = 'https://xwmckxrikcfalulwkhii.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bWNreHJpa2NmYWx1bHdraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjM3MTUsImV4cCI6MjA5MTE5OTcxNX0.8c5ty2PB2bsAwUk0ZoiY0g0dk-KIws7h4UT1MESSaGY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== СИСТЕМА ДОСТИЖЕНИЙ ==========
        const ACHIEVEMENTS = [
            { id: 'first_study', name: 'Первый шаг', desc: 'Провел первую учебную сессию', icon: '🎓', rarity: 'common', check: (user) => user.total_sessions >= 1 },
            { id: 'early_bird', name: 'Ранняя пташка', desc: 'Начал учиться до 8:00', icon: '🌅', rarity: 'common', check: (user) => user.last_start_time < 8 },
            { id: 'night_owl', name: 'Ночная сова', desc: 'Учился после 23:00', icon: '🦉', rarity: 'common', check: (user) => user.last_start_time >= 23 },
            { id: 'marathoner_2h', name: 'Марафонец', desc: 'Проучился 2 часа подряд', icon: '🏃', rarity: 'rare', check: (user) => user.max_session_duration >= 7200 },
            { id: 'marathoner_3h', name: 'Железный студент', desc: 'Проучился 3 часа подряд', icon: '🦾', rarity: 'rare', check: (user) => user.max_session_duration >= 10800 },
            { id: 'marathoner_5h', name: 'Бессмертный', desc: 'Проучился 5 часов подряд', icon: '👑', rarity: 'epic', check: (user) => user.max_session_duration >= 18000 },
            { id: 'activist_20', name: 'Активист', desc: 'Написал 20 сообщений', icon: '💬', rarity: 'common', check: (user) => user.messages_count >= 20 },
            { id: 'activist_50', name: 'Душа компании', desc: 'Написал 50 сообщений', icon: '🦋', rarity: 'rare', check: (user) => user.messages_count >= 50 },
            { id: 'activist_100', name: 'Оратор', desc: 'Написал 100 сообщений', icon: '🎙️', rarity: 'epic', check: (user) => user.messages_count >= 100 },
            { id: 'total_5h', name: 'Трудоголик', desc: 'Накопил 5 часов учебы', icon: '💪', rarity: 'common', check: (user) => user.total_study_time >= 18000 },
            { id: 'total_20h', name: 'Дедикация', desc: 'Накопил 20 часов учебы', icon: '📖', rarity: 'rare', check: (user) => user.total_study_time >= 72000 },
            { id: 'total_50h', name: 'Академик', desc: 'Накопил 50 часов учебы', icon: '🎓', rarity: 'epic', check: (user) => user.total_study_time >= 180000 },
            { id: 'total_100h', name: 'Легенда', desc: 'Накопил 100 часов учебы', icon: '⭐', rarity: 'legendary', check: (user) => user.total_study_time >= 360000 },
            { id: 'streak_7', name: 'Первая неделя', desc: 'Учился 7 дней подряд', icon: '📆', rarity: 'common', check: (user) => user.current_streak >= 7 },
            { id: 'streak_30', name: 'Месяц дисциплины', desc: 'Учился 30 дней подряд', icon: '🏆', rarity: 'epic', check: (user) => user.current_streak >= 30 },
            { id: 'streak_100', name: 'Стальной', desc: 'Учился 100 дней подряд', icon: '⚙️', rarity: 'legendary', check: (user) => user.current_streak >= 100 },
            { id: 'returner', name: 'Возвращение', desc: 'Вернулся после перерыва', icon: '🔄', rarity: 'common', check: (user) => user.returned_after_break === true }
        ];

        // ========== СТУДЕНТЫ (ДАННЫЕ) ==========
        let students = [
            { id: 1, name: 'Алмас', email: 'almas@example.com', total_study_time: 125000, total_sessions: 45, max_session_duration: 10800, last_start_time: 7, messages_count: 85, current_streak: 12, returned_after_break: false },
            { id: 2, name: 'Ержан', email: 'erzhan@example.com', total_study_time: 250000, total_sessions: 78, max_session_duration: 18000, last_start_time: 23, messages_count: 150, current_streak: 25, returned_after_break: false },
            { id: 3, name: 'Данияр', email: 'daniyar@example.com', total_study_time: 50000, total_sessions: 20, max_session_duration: 5400, last_start_time: 6, messages_count: 15, current_streak: 3, returned_after_break: true },
            { id: 4, name: 'Аружан', email: 'aruzhan@example.com', total_study_time: 380000, total_sessions: 120, max_session_duration: 21600, last_start_time: 8, messages_count: 250, current_streak: 45, returned_after_break: false },
            { id: 5, name: 'Мирас', email: 'miras@example.com', total_study_time: 75000, total_sessions: 30, max_session_duration: 7200, last_start_time: 22, messages_count: 40, current_streak: 8, returned_after_break: false }
        ];

        // Функция подсчета очков рейтинга
        function calculatePoints(student) {
            return Math.floor(student.total_study_time / 3600) * 10 + 
                   student.messages_count * 2 + 
                   student.current_streak * 5;
        }

        // Функция получения достижений для студента
        function getUnlockedAchievements(student) {
            return ACHIEVEMENTS.filter(ach => ach.check(student)).map(ach => ach.id);
        }

        // Функция получения рейтинга
        function getRanking() {
            return students.map(s => ({
                ...s,
                points: calculatePoints(s)
            })).sort((a, b) => b.points - a.points);
        }

        // Получить звание по очкам
        function getTitle(points) {
            if (points >= 3000) return { name: 'Immortal', color: '#ff4757' };
            if (points >= 2500) return { name: 'Divine', color: '#ffa502' };
            if (points >= 2000) return { name: 'Ancient', color: '#eccc68' };
            if (points >= 1500) return { name: 'Legend', color: '#2ed573' };
            if (points >= 1000) return { name: 'Archon', color: '#1e90ff' };
            if (points >= 500) return { name: 'Crusader', color: '#a4b0be' };
            return { name: 'Herald', color: '#747d8c' };
        }

        // Получить rarity class
        function getRarityClass(rarity) {
            switch(rarity) {
                case 'common': return 'rarity-common';
                case 'rare': return 'rarity-rare';
                case 'epic': return 'rarity-epic';
                case 'legendary': return 'rarity-legendary';
                default: return 'rarity-common';
            }
        }

        // Рендер страницы
        function renderApp(user, userStudentData) {
            const content = document.getElementById('content');
            
            if (!user) {
                content.innerHTML = `
                    <div class="login-container">
                        <h1 style="color:white;">🎓 Топ студентов</h1>
                        <p style="color:#aaa; margin:20px 0;">Войдите чтобы увидеть свой рейтинг и достижения</p>
                        <button class="login-btn" id="googleLoginBtn">Войти через Google</button>
                    </div>
                `;
                document.getElementById('googleLoginBtn')?.addEventListener('click', () => {
                    supabase.auth.signInWithOAuth({ provider: 'google' });
                });
                return;
            }

            const ranking = getRanking();
            const userRank = ranking.findIndex(s => s.email === user.email) + 1;
            const userData = userStudentData || students.find(s => s.email === user.email) || {
                ...students[0],
                name: user.email.split('@')[0],
                email: user.email,
                total_study_time: 0,
                total_sessions: 0,
                max_session_duration: 0,
                last_start_time: new Date().getHours(),
                messages_count: 0,
                current_streak: 1,
                returned_after_break: false
            };
            
            const unlockedAchievements = getUnlockedAchievements(userData);
            const title = getTitle(calculatePoints(userData));
            
            content.innerHTML = `
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="avatar">👨‍🎓</div>
                        <div class="profile-info">
                            <h2>${userData.name}</h2>
                            <p>${user.email} • ${title.name} <span style="color:${title.color};">🏆</span></p>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value">${Math.floor(userData.total_study_time / 3600)}ч</div>
                            <div class="stat-label">Всего учебы</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${userData.messages_count}</div>
                            <div class="stat-label">Сообщений</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${userData.current_streak} дн.</div>
                            <div class="stat-label">Стрик</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">#${userRank}</div>
                            <div class="stat-label">Место в рейтинге</div>
                        </div>
                    </div>
                    <button class="logout-btn" id="logoutBtn">Выйти</button>
                </div>
                
                <div class="rating-card">
                    <h3>🏆 Топ студентов</h3>
                    ${ranking.slice(0, 10).map((s, idx) => {
                        const isCurrentUser = s.email === user.email;
                        const studentTitle = getTitle(s.points);
                        return `
                            <div class="student-row ${isCurrentUser ? 'current-user' : ''}">
                                <div class="rank">${idx + 1}</div>
                                <div class="name">
                                    ${s.name}
                                    <span style="color:${studentTitle.color}; font-size:12px;"> [${studentTitle.name}]</span>
                                </div>
                                <div class="points">🏆 ${s.points} pts</div>
                            </div>
                        `;
                    }).join('')}
                </div>
                
                <div class="achievements-card">
                    <h3>🎖️ Достижения (${unlockedAchievements.length}/${ACHIEVEMENTS.length})</h3>
                    <div class="achievements-grid">
                        ${ACHIEVEMENTS.map(ach => {
                            const isUnlocked = unlockedAchievements.includes(ach.id);
                            return `
                                <div class="achievement ${isUnlocked ? 'unlocked' : 'locked'}">
                                    <div class="achievement-icon">${ach.icon}</div>
                                    <div class="achievement-info">
                                        <div class="achievement-name">${ach.name}</div>
                                        <div class="achievement-desc">${ach.desc}</div>
                                        <span class="achievement-rarity ${getRarityClass(ach.rarity)}">${ach.rarity}</span>
                                    </div>
                                    ${isUnlocked ? '<div style="font-size:20px;">✅</div>' : '<div style="font-size:20px;">🔒</div>'}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.reload();
            });
        }

        // Инициализация
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                // Найти или создать данные студента
                let studentData = students.find(s => s.email === session.user.email);
                if (!studentData) {
                    studentData = {
                        id: students.length + 1,
                        name: session.user.email.split('@')[0],
                        email: session.user.email,
                        total_study_time: 0,
                        total_sessions: 0,
                        max_session_duration: 0,
                        last_start_time: new Date().getHours(),
                        messages_count: 0,
                        current_streak: 1,
                        returned_after_break: false
                    };
                    students.push(studentData);
                }
                renderApp(session.user, studentData);
            } else {
                renderApp(null, null);
            }
            
            // Слушаем изменение аутентификации
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
                    window.location.reload();
                }
            });
        }
        
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Вход через Google</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Тест входа через Google</h1>
    <button id="loginBtn">Войти через Google</button>
    <div id="user"></div>

    <script>
        // Данные Supabase
        const SUPABASE_URL = 'https://xwmckxrikcfalulwkhii.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bWNreHJpa2NmYWx1bHdraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjM3MTUsImV4cCI6MjA5MTE5OTcxNX0.8c5ty2PB2bsAwUk0ZoiY0g0dk-KIws7h4UT1MESSaGY';
        
        // Создаем клиент
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Кнопка входа
        document.getElementById('loginBtn').onclick = async () => {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: 'https://kqwezshadow.github.io/shadow'
                }
            });
            
            if (error) {
                console.error('Ошибка:', error);
                alert('Ошибка: ' + error.message);
            }
        };
        
        // Проверяем, вошел ли уже пользователь
        async function checkUser() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('user').innerHTML = `<p>✅ Вы вошли как: ${user.email}</p>`;
            }
        }
        checkUser();
    </script>
</body>
</html>

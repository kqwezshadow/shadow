<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>kqwez | Dota Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f12;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: #1a1a1f;
            padding: 24px;
            border-radius: 24px;
            margin-bottom: 24px;
            border: 1px solid #2c2c32;
        }

        .auth-bar {
            background: #14141a;
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #2c2c32;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff7b2c;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: 1px solid #2c2c32;
            border-radius: 20px;
            background: #0a0a0e;
            color: #e0e0e6;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        input:focus, textarea:focus {
            border-color: #ff7b2c;
        }

        button {
            background: #ff7b2c;
            color: #0a0a0e;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }

        button:hover {
            background: #ff944d;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .logout-btn {
            background: #c2410c;
            color: white;
            width: auto;
            padding: 8px 20px;
        }

        .post {
            background: #1a1a1f;
            border: 1px solid #2c2c32;
            padding: 18px;
            margin-top: 18px;
            border-radius: 24px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-user-name {
            font-weight: 700;
            color: #ffb347;
        }

        .time {
            font-size: 0.7rem;
            color: #8e8e9e;
            margin-left: auto;
        }

        .post-text {
            margin: 12px 0;
            color: #cdcddf;
            word-break: break-word;
        }

        .post-image {
            max-width: 100%;
            border-radius: 16px;
            margin: 12px 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .post-image:hover {
            opacity: 0.9;
        }

        .like-btn {
            background: #25252c;
            color: #ffb347;
            padding: 8px 18px;
            border-radius: 40px;
            width: auto;
            cursor: pointer;
            border: 1px solid #3a3a44;
        }

        .like-btn:hover {
            background: #2f2f38;
            border-color: #ff7b2c;
        }

        .brand {
            font-weight: 800;
            font-size: 1.8rem;
            color: #ff7b2c;
            margin-bottom: 4px;
        }

        .sub-brand {
            color: #8e8e9e;
            font-size: 0.8rem;
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-message {
            text-align: center;
            padding: 32px;
            background: #1a1a1f;
            border-radius: 32px;
            color: #8e8e9e;
        }

        .image-preview {
            margin: 10px 0;
            position: relative;
            display: inline-block;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            border: 1px solid #ff7b2c;
        }

        .remove-image {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #c2410c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-input-label {
            background: #25252c;
            padding: 10px 16px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ffb347;
            border: 1px solid #3a3a44;
            transition: 0.2s;
        }

        .file-input-label:hover {
            background: #2f2f38;
            border-color: #ff7b2c;
        }

        input[type="file"] {
            display: none;
        }

        .upload-progress {
            font-size: 0.8rem;
            color: #ffb347;
            margin-top: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            cursor: pointer;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div style="width:100%; max-width:580px;">
    <div class="brand">⚔️ kqwez pl</div>
    <p class="sub-brand">дота общество</p>
</div>

<div id="authSection" class="container">
    <div id="loginButtonWrapper">
        <button id="demoLoginBtn" style="background: #ff7b2c;">🔥 Войти в дота общество</button>
    </div>
    <div id="userInfoPanel" style="display: none;">
        <div class="auth-bar">
            <img id="userPhoto" class="user-avatar" src="">
            <span id="userDisplayName" style="flex:1; color:#ffb347;"></span>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
    </div>
</div>

<div id="messageForm" class="container" style="display: none;">
    <h3 style="color:#ffb347; margin-bottom: 16px;">💬 Новая запись</h3>
    <input type="text" id="nameField" placeholder="Ваше имя">
    <textarea id="contentInput" rows="3" placeholder="Поделись мыслью о доте..."></textarea>
    
    <!-- Загрузка изображений -->
    <div class="flex-row" style="margin: 10px 0;">
        <label class="file-input-label">
            📷 Прикрепить картинку
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp">
        </label>
        <span id="fileName" style="color:#8e8e9e; font-size:0.8rem;"></span>
    </div>
    
    <!-- Превью изображения -->
    <div id="imagePreview" style="display: none;" class="image-preview">
        <img id="previewImg" src="" alt="Preview">
        <button id="removeImageBtn" class="remove-image">×</button>
    </div>
    
    <div id="uploadProgress" class="upload-progress" style="display: none;"></div>
    <button id="publishBtn">📢 Опубликовать в чат</button>
</div>

<div id="feed"></div>

<!-- Модальное окно для просмотра изображений -->
<div id="imageModal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImage">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
        serverTimestamp, updateDoc, doc, increment 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { 
        getStorage, ref, uploadBytesResumable, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1FadsdnN8ZnKkdgYKqfMIOgxyph5zM3A",
        authDomain: "kqwez-token.firebaseapp.com",
        projectId: "kqwez-token",
        storageBucket: "kqwez-token.firebasestorage.app",
        messagingSenderId: "508135236384",
        appId: "1:508135236384:web:75514deba078c0dabfad45",
        measurementId: "G-KS7JWV33JS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentDemoUser = null;
    let selectedImageFile = null;
    let isUploading = false;
    
    const loginButtonWrapper = document.getElementById('loginButtonWrapper');
    const userInfoPanel = document.getElementById('userInfoPanel');
    const messageForm = document.getElementById('messageForm');
    const userPhoto = document.getElementById('userPhoto');
    const userDisplayName = document.getElementById('userDisplayName');
    const nameField = document.getElementById('nameField');
    const contentInput = document.getElementById('contentInput');
    const publishBtn = document.getElementById('publishBtn');
    const feedContainer = document.getElementById('feed');
    const demoLoginBtn = document.getElementById('demoLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const fileNameSpan = document.getElementById('fileName');
    const uploadProgressDiv = document.getElementById('uploadProgress');
    
    // Модальное окно
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeModal = document.getElementsByClassName('close-modal')[0];

    let unsubscribeSnapshot = null;

    // Функция загрузки изображения в Storage
    async function uploadImage(file) {
        if (!file) return null;
        
        const timestamp = Date.now();
        const fileName = `posts/${timestamp}_${file.name}`;
        const storageRef = ref(storage, fileName);
        const uploadTask = uploadBytesResumable(storageRef, file);
        
        return new Promise((resolve, reject) => {
            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    uploadProgressDiv.style.display = 'block';
                    uploadProgressDiv.textContent = `📤 Загрузка: ${Math.round(progress)}%`;
                },
                (error) => {
                    console.error("Ошибка загрузки:", error);
                    uploadProgressDiv.style.display = 'none';
                    reject(error);
                },
                async () => {
                    const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                    uploadProgressDiv.style.display = 'none';
                    resolve(downloadURL);
                }
            );
        });
    }

    // Обработка выбора файла
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
            if (file.size > 5 * 1024 * 1024) {
                alert("Изображение слишком большое! Максимум 5MB.");
                return;
            }
            selectedImageFile = file;
            fileNameSpan.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            alert("Пожалуйста, выберите изображение (JPG, PNG, GIF, WEBP)");
        }
    });

    // Удаление выбранного изображения
    removeImageBtn.addEventListener('click', () => {
        selectedImageFile = null;
        imageInput.value = '';
        fileNameSpan.textContent = '';
        imagePreview.style.display = 'none';
        previewImg.src = '';
    });

    function startRealtimeFeed() {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
            if (!feedContainer) return;
            feedContainer.innerHTML = "";
            if (snapshot.empty) {
                feedContainer.innerHTML = `<div class="info-message">💀 Пока тихо... Напиши что-нибудь про доту или кинь картинку!</div>`;
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const likesCount = data.likes ?? 0;
                const userName = data.name || "Аноним";
                const userPhotoURL = data.photo || `https://ui-avatars.com/api/?background=ff7b2c&color=0a0a0e&bold=true&size=40&name=${encodeURIComponent(userName)}`;
                const postText = data.text || "";
                const imageUrl = data.imageUrl || null;
                const timestampRaw = data.timestamp;
                
                let formattedTime = "только что";
                if (timestampRaw?.toDate) {
                    formattedTime = timestampRaw.toDate().toLocaleString('ru-RU', { hour: '2-digit', minute:'2-digit', day:'numeric', month:'short' });
                }
                
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                
                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = `<img class="post-image" src="${escapeHtml(imageUrl)}" alt="post image" onclick="openModal('${escapeHtml(imageUrl)}')">`;
                }
                
                postDiv.innerHTML = `
                    <div class="post-header">
                        <img class="post-avatar" src="${escapeHtml(userPhotoURL)}">
                        <span class="post-user-name">${escapeHtml(userName)}</span>
                        <span class="time">🕒 ${escapeHtml(formattedTime)}</span>
                    </div>
                    ${postText ? `<div class="post-text">${escapeHtml(postText)}</div>` : ''}
                    ${imageHtml}
                    <div class="flex-row">
                        <button class="like-btn" data-id="${docId}">❤️ ${likesCount} · Плюсануть</button>
                    </div>
                `;
                
                const likeButton = postDiv.querySelector('.like-btn');
                likeButton.addEventListener('click', async () => {
                    try {
                        await updateDoc(doc(db, "requests", docId), { likes: increment(1) });
                    } catch (err) {
                        alert("Ошибка лайка: " + err.message);
                    }
                });
                
                feedContainer.appendChild(postDiv);
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Глобальная функция для модального окна
    window.openModal = (url) => {
        modal.style.display = "block";
        modalImg.src = url;
    };

    closeModal.onclick = () => {
        modal.style.display = "none";
    };

    modal.onclick = (e) => {
        if (e.target === modal) {
            modal.style.display = "none";
        }
    };

    demoLoginBtn.onclick = () => {
        const demoName = prompt("Введите ваше имя для чата:", "DotaPlayer");
        if (demoName && demoName.trim()) {
            currentDemoUser = {
                displayName: demoName.trim(),
                email: `${demoName.trim().toLowerCase()}@demo.kqwez`,
                photoURL: `https://ui-avatars.com/api/?background=ff7b2c&color=0a0a0e&bold=true&size=44&name=${encodeURIComponent(demoName.trim())}`
            };
            updateUIForUser(currentDemoUser);
        }
    };

    function updateUIForUser(user) {
        loginButtonWrapper.style.display = 'none';
        userInfoPanel.style.display = 'block';
        messageForm.style.display = 'block';
        userDisplayName.innerText = user.displayName;
        userPhoto.src = user.photoURL;
        nameField.value = user.displayName;
        startRealtimeFeed();
    }

    function logout() {
        currentDemoUser = null;
        loginButtonWrapper.style.display = 'block';
        userInfoPanel.style.display = 'none';
        messageForm.style.display = 'none';
        if (unsubscribeSnapshot) {
            unsubscribeSnapshot();
            unsubscribeSnapshot = null;
        }
        feedContainer.innerHTML = `<div class="info-message">🔐 Войдите, чтобы начать общаться в чате</div>`;
        // Сброс формы
        selectedImageFile = null;
        imageInput.value = '';
        fileNameSpan.textContent = '';
        imagePreview.style.display = 'none';
        previewImg.src = '';
    }

    logoutBtn.onclick = logout;

    publishBtn.onclick = async () => {
        if (!currentDemoUser) {
            alert("Сначала войдите в чат!");
            return;
        }
        
        const postContent = contentInput.value.trim();
        if (!postContent && !selectedImageFile) {
            alert("Напиши что-нибудь или прикрепи картинку!");
            return;
        }
        
        const userName = nameField.value.trim() || currentDemoUser.displayName;
        
        publishBtn.disabled = true;
        publishBtn.innerText = "Публикация...";
        
        let imageUrl = null;
        
        try {
            // Если есть изображение, загружаем его в Storage
            if (selectedImageFile) {
                imageUrl = await uploadImage(selectedImageFile);
            }
            
            // Сохраняем пост в Firestore
            await addDoc(collection(db, "requests"), {
                name: userName,
                email: currentDemoUser.email,
                photo: currentDemoUser.photoURL,
                text: postContent,
                imageUrl: imageUrl,
                likes: 0,
                timestamp: serverTimestamp()
            });
            
            // Очищаем форму
            contentInput.value = "";
            selectedImageFile = null;
            imageInput.value = '';
            fileNameSpan.textContent = '';
            imagePreview.style.display = 'none';
            previewImg.src = '';
            
            // Показываем уведомление
            const toastMsg = document.createElement('div');
            toastMsg.textContent = imageUrl ? "✅ Пост с картинкой опубликован!" : "✅ Сообщение опубликовано!";
            toastMsg.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff7b2c; color:#0a0a0e; padding:8px 20px; border-radius:40px; font-weight:bold; z-index:1000; font-size:0.85rem;";
            document.body.appendChild(toastMsg);
            setTimeout(() => toastMsg.remove(), 2000);
            
        } catch (error) {
            console.error("Ошибка:", error);
            alert("❌ Ошибка: " + error.message);
        } finally {
            publishBtn.disabled = false;
            publishBtn.innerText = "📢 Опубликовать в чат";
        }
    };

    // Инициализация
    startRealtimeFeed();
    console.log("🔥 kqwez pl — дота общество с загрузкой картинок!");
</script>
</body>
</html>

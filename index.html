<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Где ты? - Никита</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .my-info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(0.98);
        }
        .home { background: #10b981; }
        .college { background: #3b82f6; }
        .coffee { background: #f59e0b; }
        .pclub { background: #ef4444; }
        .user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .status-icon { font-size: 28px; }
        .user-name { font-weight: bold; }
        .user-status { font-size: 12px; color: #666; margin-top: 4px; }
        .error {
            background: #fee;
            color: red;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📍 Где ты, Никита? <span style="font-size: 12px; background: #10b981; color: white; padding: 2px 8px; border-radius: 20px;">LIVE</span></h1>
            <p style="color: #666; font-size: 14px;">Поделись своим местоположением</p>
        </div>

        <div id="myInfo" class="my-info">Загрузка...</div>
        <div id="error"></div>

        <div class="buttons">
            <button class="home" onclick="setStatus('Дома')">🏠 Дома</button>
            <button class="college" onclick="setStatus('В колледже')">🏫 В колледже</button>
            <button class="coffee" onclick="setStatus('В кофе')">☕ В кофе</button>
            <button class="pclub" onclick="setStatus('В ПК клубе')">🎮 В ПК клубе</button>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 15px 0;">👥 Команда <span class="online-dot"></span></h3>
            <div id="users">Загрузка...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://rncerhgizyjhovbdpqnl.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4bWNlcmhnaXp5amhvdmJkcHFubCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzU5MTI1NjMyLCJleHAiOjIwNzQ3MDE2MzJ9.K7U-7jOJHExwxM1XmYCQunP-XM5-fOgEp0tRjz7qbA0';
        const MY_ID = '64e0c828-9e67-45db-ab5a-73bb67da5aba';
        
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        window.setStatus = async (status) => {
            const { error } = await supabase
                .from('profiles')
                .update({ status: status })
                .eq('id', MY_ID);
            
            if (error) {
                document.getElementById('error').innerHTML = `<div class="error">❌ ${error.message}</div>`;
                setTimeout(() => document.getElementById('error').innerHTML = '', 3000);
            } else {
                loadUsers();
            }
        };
        
        async function loadUsers() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('username');
            
            if (error) {
                document.getElementById('users').innerHTML = `<div class="error">❌ ${error.message}</div>`;
                return;
            }
            
            const me = data.find(u => u.id === MY_ID);
            if (me) {
                document.getElementById('myInfo').innerHTML = `👋 <strong>${me.username}</strong><br>📍 Твой статус: <strong style="color: #667eea;">${me.status || 'не задан'}</strong>`;
            }
            
            document.getElementById('users').innerHTML = data.map(u => {
                let icon = '📍';
                if (u.status === 'Дома') icon = '🏠';
                else if (u.status === 'В колледже') icon = '🏫';
                else if (u.status === 'В кофе') icon = '☕';
                else if (u.status === 'В ПК клубе') icon = '🎮';
                
                return `
                    <div class="user-item">
                        <div class="status-icon">${icon}</div>
                        <div>
                            <div class="user-name">${u.username} ${u.id === MY_ID ? '<span style="color: #667eea;">(Вы)</span>' : ''}</div>
                            <div class="user-status">${u.status || 'Не указано'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Realtime
        supabase
            .channel('online-status')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadUsers())
            .subscribe();
        
        loadUsers();
    </script>
</body>
</html>
